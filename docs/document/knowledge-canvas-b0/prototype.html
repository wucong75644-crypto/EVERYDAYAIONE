<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>统一知识画布 · B0 交互原型</title>
<style>
:root{color-scheme:dark;--bg:#101216;--panel:#171a20;--card:#20242d;--line:#303642;--text:#eceef4;--muted:#939dae;--accent:#8daaff;--green:#8bceb1}
*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:0;border-radius:7px}button:hover{background:#ffffff0c}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,textarea,select{color:var(--text);background:#101319;border:1px solid var(--line);border-radius:7px;padding:10px}textarea{resize:vertical}button.primary{background:#819ff0;color:#101724;font-weight:650;padding:10px 18px}button.secondary{border:1px solid var(--line);padding:9px 14px}.muted{color:var(--muted)}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#14171c}.brand{display:flex;gap:12px;align-items:center}.logo{width:29px;height:29px;display:grid;place-items:center;border:1px solid #829be1;border-radius:8px;color:#a9bcff;font-weight:800}.badge{font-size:11px;border:1px solid #3e4654;border-radius:5px;padding:2px 7px;color:var(--muted)}.header-actions{display:flex;gap:10px;align-items:center}#reset{padding:8px 12px;color:var(--muted)}main{height:calc(100vh - 62px);display:flex;overflow:hidden}#workspace{position:relative;flex:1;min-width:400px;overflow:hidden}#viewport{position:absolute;inset:0;overflow:hidden;background-image:radial-gradient(#3a404e 1px,transparent 1px);background-size:24px 24px;touch-action:none}#world{position:absolute;left:0;top:0;width:4000px;height:2800px;transform-origin:0 0;pointer-events:none}#edges{position:absolute;inset:0;width:4000px;height:2800px;overflow:visible;pointer-events:none}#edges path{fill:none;stroke:#505d79;stroke-width:2}#edges .association{stroke-dasharray:6 5;stroke:#6a8b7b}#dragline{stroke:#a6bbff!important;stroke-dasharray:5 4}
.node{position:absolute;width:228px;min-height:112px;background:var(--card);border:1px solid #39414f;border-radius:10px;padding:14px 16px;box-shadow:0 7px 18px #0002;pointer-events:auto;user-select:none}.node.root{border-color:#6f86ba;background:#242c3e}.node.selected{outline:2px solid #99b1ff;outline-offset:3px}.node.highlight{animation:glow 1.6s ease}.node .type{font-size:10px;letter-spacing:.07em;color:#a9b6d0;text-transform:uppercase;margin-bottom:6px}.node h3{font-size:15px;font-weight:600;margin:0 12px 7px 0}.node .summary{font-size:12px;color:#a7afbd;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:38px}.node .node-meta{font-size:11px;color:#88b9a7;margin-top:11px}.handle{position:absolute;right:-8px;top:47px;width:16px;height:16px;border:3px solid #131923;background:#9cb8ff;border-radius:50%;padding:0;cursor:crosshair}.open-node{margin-top:10px;padding:3px 7px;background:#ffffff08;color:#b9c7e4;font-size:11px}.breadcrumb{position:absolute;top:20px;left:24px;z-index:2;display:flex;gap:12px;align-items:center;font-size:12px;color:var(--muted);background:#101216de;padding:7px 10px;border-radius:6px}#back{border:1px solid var(--line);padding:5px 10px}#back:disabled{opacity:.35;cursor:default}.tools{position:absolute;right:20px;top:20px;display:flex;gap:4px;background:#1a1f28;border:1px solid var(--line);border-radius:8px;padding:4px;z-index:2}.tools button{min-width:30px;padding:4px}#zoomLabel{font-size:11px;padding:7px 5px;color:var(--muted)}.hint{position:absolute;left:25px;bottom:22px;font-size:11px;color:#8a95a7;background:#101216df;padding:6px 10px;border-radius:5px;pointer-events:none}
#sidebar{width:338px;min-width:270px;max-width:480px;resize:horizontal;overflow:auto;border-left:1px solid var(--line);background:var(--panel);z-index:5}.tabs{display:flex;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:13px 10px 0;gap:1px}.tab{flex:1;padding:13px 5px 14px;border-radius:0;color:var(--muted);font-size:12px;white-space:nowrap}.tab[aria-selected=true]{color:#c0d0ff;border-bottom:2px solid #a4bbff}.searchbox{padding:20px 17px 12px}.searchbox input{width:100%;background:#10141b;font-size:12px}#scopeLabel{font-size:10px;color:#8f9db3;margin-top:7px}#tree{padding:2px 10px 40px}.tree-row{width:100%;text-align:left;display:flex;align-items:center;gap:9px;padding:9px 10px;min-height:37px;font-size:12px}.tree-row.current{background:#8daaff15;color:#c5d4ff}.tree-icon{color:#8b9bb6;font-size:11px}.tree-section{display:flex;gap:7px;align-items:center;margin:13px 0 5px}.tree-section>button:nth-child(2){flex:1;text-align:left;font-size:12px;font-weight:600;padding:7px 0}.collapse{width:21px;color:#8b9bb6}.empty{padding:26px 12px;color:var(--muted);font-size:12px}#menu{position:fixed;z-index:30;width:225px;background:#20252e;border:1px solid #465066;box-shadow:0 12px 35px #0007;border-radius:9px;padding:6px}#menu .menu-label{color:var(--muted);font-size:10px;padding:6px 9px}#menu button{width:100%;text-align:left;font-size:12px;padding:8px 10px}#menu hr{border:0;border-top:1px solid #384050;margin:4px}
dialog{border:1px solid #465066;border-radius:14px;background:#1b2029;color:var(--text);padding:24px;width:530px;max-width:calc(100vw - 40px);max-height:85vh;box-shadow:0 25px 90px #0008}dialog::backdrop{background:#070a1099}dialog h2{margin:0 0 18px;font-size:18px}dialog label{display:block;color:#b6c0d1;font-size:12px;margin:12px 0 5px}dialog input:not([type=file]),dialog textarea,dialog select{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:21px}.form-error{font-size:12px;color:#efa2a2;margin-top:10px}.preview-media{width:100%;max-height:50vh;object-fit:contain;border-radius:8px}#previewText{min-height:250px}#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:100;background:#30394b;color:#eef2ff;padding:11px 18px;border:1px solid #5b6e91;border-radius:9px;font-size:12px;box-shadow:0 8px 22px #0004}[hidden]{display:none!important}@keyframes glow{0%,70%{box-shadow:0 0 0 8px #8daaff33}100%{box-shadow:0 0 0 0 #8daaff00}}@media(max-width:900px){#sidebar{width:280px;min-width:250px}.brand .badge{display:none}.hint{font-size:10px}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo">E</span><strong>知识工作台</strong><span class="badge">B0 交互原型</span></div><div class="header-actions"><span class="muted" style="font-size:11px">本地假数据 · 不调用模型，不发送消息</span><button id="reset">重置示例</button></div></header>
<main>
<section id="workspace" aria-label="知识画布工作区">
<div id="viewport" tabindex="0" aria-label="无限画布"><div id="world"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div>
<div class="breadcrumb"><button id="back" disabled>← 返回</button><span>工作画布</span><span>/</span><span id="canvasContext">A 客户项目</span></div>
<div class="tools"><button id="zoomOut" aria-label="缩小">−</button><span id="zoomLabel">80%</span><button id="zoomIn" aria-label="放大">＋</button><button id="fit" aria-label="适应当前分支">适应</button></div>
<div class="hint">双击空白创建 · 从连接点拉线创建 · Tab 子节点 · Enter 同级 · 空格拖动平移</div>
</section>
<aside id="sidebar" aria-label="内容导航">
<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="personal" aria-selected="false">个人知识库</button><button class="tab" role="tab" data-tab="project" aria-selected="true">项目</button><button class="tab" role="tab" data-tab="team" aria-selected="false">团队知识库</button></div>
<div class="searchbox"><input id="search" aria-label="搜索当前范围" placeholder="搜索 A 客户项目…"><div id="scopeLabel">当前范围：A 客户项目 · 不搜索对话</div></div><nav id="tree" aria-label="内容目录"></nav>
</aside></main>
<div id="menu" hidden></div><div id="toast" role="status" hidden></div>
<dialog id="createDialog"><form id="createForm"><h2 id="createHeading">创建内容</h2><label for="nodeTitle">标题</label><input id="nodeTitle" autocomplete="off"><label for="nodeScope">归属</label><select id="nodeScope"><option value="personal">个人知识库</option><option value="project">项目 · A 客户项目</option><option value="team">团队知识库</option></select><div id="bodyFields"><label for="nodeBody">内容</label><textarea id="nodeBody" rows="4" placeholder="先写下想法，之后可以继续补充"></textarea></div><div id="fileFields" hidden><label for="bindFile">选择文件</label><input id="bindFile" type="file"><p class="muted" style="font-size:11px">文件只在此浏览器会话中预览，不会上传。</p></div><div id="taskFields" hidden><label for="taskDate">截止日期</label><input id="taskDate" type="date"></div><div id="formError" class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" class="secondary" data-close="createDialog">取消</button><button class="primary" type="submit">保存到画布</button></div></form></dialog>
<dialog id="previewDialog"><h2 id="previewTitle"></h2><div id="previewInfo" class="muted" style="font-size:11px"></div><div id="previewContent"></div><div class="dialog-actions"><button type="button" class="secondary" data-close="previewDialog">关闭</button><button id="savePreview" class="primary">保存修改</button></div></dialog>
<dialog id="scheduleDialog"><form id="scheduleForm"><h2>设置定时任务</h2><p id="scheduleSource" class="muted"></p><label for="scheduleTitle">任务名称</label><input id="scheduleTitle"><label for="scheduleAction">要做什么</label><textarea id="scheduleAction" rows="2">汇总该分支的本周更新与待办进展，生成周报。</textarea><label for="scheduleFrequency">执行频率</label><select id="scheduleFrequency"><option value="每周五">每周五</option><option value="每天">每天</option><option value="单次">单次</option></select><label for="scheduleTime">执行时间 · 上海时间</label><input id="scheduleTime" type="time" value="17:00"><label for="scheduleRecipient">推送目标</label><select id="scheduleRecipient"><option value="项目交付群">项目交付群（示例）</option><option value="企业微信个人通知">企业微信个人通知（示例）</option><option value="销售协作群">销售协作群（示例）</option></select><p class="muted" style="font-size:11px">读取最新已保存内容。本原型只演示配置，不执行调度或发送。</p><div class="dialog-actions"><button type="button" class="secondary" data-close="scheduleDialog">取消</button><button type="submit" class="primary">保存定时任务</button></div></form></dialog>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
const types={topic:'主题',document:'文档',file:'文件',work_item:'待办',automation:'定时任务',project:'项目',rule:'规则'};
const scopes={personal:'个人知识库',project:'项目',team:'团队知识库'};
const initial=[
{id:'root-after',title:'售后处理',type:'topic',scope:'project',project:'project-a',parent:null,x:90,y:240,body:'客户退换货的判断依据、处理步骤和跟进记录。',meta:'总分支 · 保存即可 @ 调用'},
{id:'rule-after',title:'处理规则',type:'rule',scope:'project',project:'project-a',parent:'root-after',x:425,y:50,body:'先核对订单、商品状态与收货日期。资料不足先询问，不直接承诺退款；超出政策转人工。',meta:'规则 · 当前分支适用'},
{id:'policy-after',title:'退换货政策',type:'document',scope:'project',project:'project-a',parent:'root-after',x:425,y:275,body:'符合七天无理由条件且商品完好的订单，可申请退货。质量问题保留照片并转售后确认。处理结果应记录原因和下一步。',meta:'文档 · 已保存'},
{id:'file-after',title:'客户需求.txt',type:'file',scope:'project',project:'project-a',parent:'root-after',x:425,y:500,body:'客户已收货三天，商品未拆封，希望退货。尚未提供订单号。',fileName:'客户需求.txt',mime:'text/plain',meta:'附件 · 可展开'},
{id:'todo-after',title:'核对订单信息',type:'work_item',scope:'project',project:'project-a',parent:'policy-after',x:755,y:275,body:'收集订单号，核对收货日期和商品状态。',meta:'待办 · 未完成'},
{id:'root-product',title:'新品发布',type:'topic',scope:'project',project:'project-b',parent:null,x:1470,y:200,body:'新品资料、发布节奏与交付清单。',meta:'总分支 · 保存即可 @ 调用'},
{id:'root-personal',title:'学习笔记',type:'topic',scope:'personal',project:null,parent:null,x:90,y:1040,body:'个人阅读与思考。默认仅自己可见。',meta:'总分支 · 个人'},
{id:'root-team',title:'产品手册',type:'topic',scope:'team',project:null,parent:null,x:755,y:1040,body:'团队共享的产品资料与标准回答口径。',meta:'总分支 · 团队'}
];
let nodes=structuredClone(initial),links=[],undo=[],selected=null,tab='project',project='project-a',pan={x:45,y:30,z:.8},history=[],space=false,drag=null,pending=null,editing=null,scheduleTarget=null,toastTimer=null;
const queries={personal:'',project:'',team:''},collapsed=new Set(),projectNames={'project-a':'A 客户项目','project-b':'产品开发'};
const viewport=$('#viewport'),world=$('#world');
function get(id){return nodes.find(n=>n.id===id);}
function descendants(id){const found=[],queue=[id],seen=new Set();while(queue.length){const next=queue.shift();if(seen.has(next))continue;seen.add(next);const n=get(next);if(n)found.push(n);nodes.filter(n=>n.parent===next).forEach(n=>queue.push(n.id));}return found;}
function checkpoint(){undo.push(JSON.stringify({nodes,links}));if(undo.length>40)undo.shift();}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2800);}
function transform(){world.style.transform='translate('+pan.x+'px,'+pan.y+'px) scale('+pan.z+')';$('#zoomLabel').textContent=Math.round(pan.z*100)+'%';}
function point(x,y){const r=viewport.getBoundingClientRect();return{x:(x-r.left-pan.x)/pan.z,y:(y-r.top-pan.y)/pan.z};}
function zoom(factor,x,y){const r=viewport.getBoundingClientRect();const px=x===undefined?r.width/2:x-r.left,py=y===undefined?r.height/2:y-r.top;const z=Math.max(.25,Math.min(1.8,pan.z*factor));pan.x=px-(px-pan.x)*z/pan.z;pan.y=py-(py-pan.y)*z/pan.z;pan.z=z;transform();}
function center(list,remember=true){if(!list.length)return;if(remember){history.push({...pan});$('#back').disabled=false;}const r=viewport.getBoundingClientRect();const minX=Math.min(...list.map(n=>n.x)),minY=Math.min(...list.map(n=>n.y)),maxX=Math.max(...list.map(n=>n.x+228)),maxY=Math.max(...list.map(n=>n.y+195));pan.z=Math.min(1.05,(r.width-90)/(maxX-minX),(r.height-245)/(maxY-minY));pan.z=Math.max(.25,pan.z);pan.x=(r.width-(maxX-minX)*pan.z)/2-minX*pan.z;pan.y=65+(r.height-245-(maxY-minY)*pan.z)/2-minY*pan.z;transform();}
function locate(id){const n=get(id);if(!n)return toast('内容已不可用');let ancestor=get(n.parent);while(ancestor){collapsed.delete(ancestor.id);ancestor=get(ancestor.parent);}selected=id;center([n]);renderNodes();const el=document.getElementById('node-'+id);el.classList.add('highlight');setTimeout(()=>el.classList.remove('highlight'),1700);}
function path(a,b){return'M '+(a.x+228)+' '+(a.y+58)+' C '+(a.x+300)+' '+(a.y+58)+','+(b.x-75)+' '+(b.y+58)+','+b.x+' '+(b.y+58);}
function hiddenByFold(n){let parent=get(n.parent);while(parent){if(collapsed.has(parent.id))return true;parent=get(parent.parent);}return false;}
function renderEdges(){const svg=$('#edges');svg.replaceChildren();nodes.forEach(n=>{const parent=get(n.parent);if(parent&&!hiddenByFold(n)){const e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('d',path(parent,n));svg.append(e);}});links.forEach(l=>{const a=get(l.from),b=get(l.to);if(a&&b&&!hiddenByFold(a)&&!hiddenByFold(b)){const e=document.createElementNS('http://www.w3.org/2000/svg','path');e.classList.add('association');e.setAttribute('d',path(a,b));svg.append(e);}});}
function renderNodes(){const target=$('#nodes');target.replaceChildren();nodes.filter(n=>!hiddenByFold(n)).forEach(n=>{const e=make('article','node'+(!n.parent?' root':'')+(selected===n.id?' selected':''));e.id='node-'+n.id;e.dataset.nodeId=n.id;e.tabIndex=0;e.setAttribute('aria-label',n.title);e.style.left=n.x+'px';e.style.top=n.y+'px';e.append(make('div','type',types[n.type]+(!n.parent?' / 总分支':'')),make('h3','',n.title),make('div','summary',n.body||'选中后继续输入或绑定资料'));if(n.meta)e.append(make('div','node-meta',n.meta));if(['document','file','rule','work_item','automation'].includes(n.type)){const b=make('button','open-node','展开查看');b.onclick=()=>openPreview(n.id);e.append(b);}const childCount=nodes.filter(c=>c.parent===n.id).length;if(childCount){const fold=make('button','open-node',(collapsed.has(n.id)?'展开 ':'收起 ')+childCount+' 个分支');fold.setAttribute('aria-label','折叠或展开 '+n.title);fold.onclick=()=>{collapsed.has(n.id)?collapsed.delete(n.id):collapsed.add(n.id);render();};e.append(fold);}const h=make('button','handle');h.setAttribute('aria-label','从 '+n.title+' 拉线创建');h.onpointerdown=ev=>{ev.stopPropagation();ev.preventDefault();drag={mode:'connect',source:n.id};viewport.setPointerCapture(ev.pointerId);};e.append(h);e.onpointerdown=ev=>{if(ev.target.closest('button'))return;ev.stopPropagation();if(ev.button===2)return;if(space){drag={mode:'pan',x:ev.clientX,y:ev.clientY,pan:{...pan}};viewport.setPointerCapture(ev.pointerId);return;}selected=n.id;renderNodes();drag={mode:'node',id:n.id,x:ev.clientX,y:ev.clientY,start:{x:n.x,y:n.y},saved:false};viewport.setPointerCapture(ev.pointerId);};e.ondblclick=ev=>{ev.stopPropagation();openPreview(n.id);};e.oncontextmenu=ev=>{ev.preventDefault();ev.stopPropagation();selected=n.id;renderNodes();showMenu(ev.clientX,ev.clientY,n.id);};target.append(e);});renderEdges();}
function scopeNodes(){return nodes.filter(n=>n.scope===tab&&(tab!=='project'||n.project===project));}
function navRow(n,depth){const b=make('button','tree-row'+(selected===n.id?' current':''));b.style.paddingLeft=(10+depth*14)+'px';b.dataset.navId=n.id;b.append(make('span','tree-icon',n.parent?'└':'◇'),make('span','',n.title));b.onclick=()=>{locate(n.id);renderTree();};return b;}
function renderTree(){const target=$('#tree');target.replaceChildren();const q=$('#search').value.trim().toLowerCase();const scopeName=tab==='project'?projectNames[project]:scopes[tab];$('#search').placeholder='搜索 '+scopeName+'…';$('#scopeLabel').textContent='当前范围：'+scopeName+' · 不搜索对话';$('#canvasContext').textContent=scopeName;if(q){const hits=scopeNodes().filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));if(!hits.length)target.append(make('div','empty','当前范围没有匹配内容'));hits.forEach(n=>target.append(navRow(n,0)));return;}
const renderBranch=(n,depth)=>{target.append(navRow(n,depth));if(!collapsed.has(n.id))nodes.filter(c=>c.parent===n.id).forEach(c=>renderBranch(c,depth+1));};
if(tab==='project'){Object.entries(projectNames).forEach(([id,name])=>{const sec=make('div','tree-section');const c=make('button','collapse',collapsed.has(id)?'▸':'▾');c.setAttribute('aria-label','展开或折叠 '+name);c.onclick=()=>{collapsed.has(id)?collapsed.delete(id):collapsed.add(id);renderTree();};const b=make('button','',name);b.onclick=()=>{project=id;$('#search').value='';const roots=nodes.filter(n=>n.project===id&&!n.parent);center(roots.flatMap(n=>descendants(n.id)));renderTree();};sec.append(c,b);target.append(sec);if(!collapsed.has(id))nodes.filter(n=>n.project===id&&!n.parent).forEach(n=>renderBranch(n,0));});}else scopeNodes().filter(n=>!n.parent).forEach(n=>renderBranch(n,0));}
function render(){renderNodes();renderTree();transform();}
function closeMenu(){$('#menu').hidden=true;}
function menuButton(label,fn){const b=make('button','',label);b.onclick=()=>{closeMenu();fn();};$('#menu').append(b);}
function showMenu(x,y,parent=null){const menu=$('#menu');menu.replaceChildren();menu.append(make('div','menu-label',parent?'围绕当前内容':'在画布创建'));['topic','document','rule','file','work_item','project'].forEach(type=>menuButton(types[type],()=>openCreate(type,point(x,y),parent)));menu.append(document.createElement('hr'));if(parent){menuButton('设置定时任务',()=>openSchedule(parent));menuButton('在目录中显示',()=>{const n=get(parent);switchTab(n.scope);if(n.project)project=n.project;renderTree();toast('已定位目录条目');});menuButton('修改标题',()=>rename(parent));}menu.style.left=Math.min(x,innerWidth-240)+'px';menu.style.top=Math.max(70,Math.min(y,innerHeight-375))+'px';menu.hidden=false;}
function openCreate(type,pos,parent){const source=get(parent);pending={type,pos,parent};$('#createHeading').textContent='创建'+types[type];$('#nodeTitle').value='';$('#nodeBody').value='';$('#bindFile').value='';$('#formError').textContent='';$('#nodeScope').value=source?source.scope:tab;$('#bodyFields').hidden=type==='file';$('#fileFields').hidden=type!=='file';$('#taskFields').hidden=type!=='work_item';$('#createDialog').showModal();$('#nodeTitle').focus();}
async function saveCreate(ev){ev.preventDefault();const title=$('#nodeTitle').value.trim();if(!title){$('#formError').textContent='请输入标题，取消不会留下空节点';return;}let fileData={};if(pending.type==='file'){const file=$('#bindFile').files[0];if(!file){$('#formError').textContent='请选择要绑定的文件';return;}fileData={fileName:file.name,mime:file.type||'application/octet-stream'};if(file.type.startsWith('text/')||/\.(txt|md|json|csv)$/i.test(file.name))fileData.body=await file.text();else fileData.url=URL.createObjectURL(file);}
checkpoint();const scope=$('#nodeScope').value,parent=get(pending.parent);const id='created-'+crypto.randomUUID();const isProject=pending.type==='project';const projectId=isProject?id:scope==='project'?(parent?.project||project):null;if(isProject)projectNames[id]=title;
const n={id,title,type:isProject?'topic':pending.type,scope:isProject?'project':scope,project:projectId,parent:!isProject&&parent&&parent.scope===scope?parent.id:null,x:pending.pos.x,y:pending.pos.y,body:$('#nodeBody').value,meta:pending.type==='work_item'?'待办 · '+($('#taskDate').value||'未设截止日期'):'已保存 · 本地演示',...fileData};nodes.push(n);selected=id;$('#createDialog').close();render();toast('已创建并归类');}
function rename(id){const n=get(id);if(!n)return;editing=id;openPreview(id,true);}
function openPreview(id,titleOnly=false){const n=get(id);if(!n)return;editing=id;$('#previewTitle').textContent=n.title;$('#previewInfo').textContent=types[n.type]+' · '+scopes[n.scope]+' · 本地演示';const body=$('#previewContent');body.replaceChildren();const title=make('input');title.id='editTitle';title.value=n.title;title.setAttribute('aria-label','内容标题');body.append(title);const editable=titleOnly||['topic','document','rule','work_item','automation'].includes(n.type)||(n.mime||'').startsWith('text/');$('#savePreview').hidden=!editable;
if(editable){const t=make('textarea');t.id='previewText';t.setAttribute('aria-label','内容正文');t.value=n.body||'';t.style.width='100%';t.style.marginTop='12px';body.append(t);}else if((n.mime||'').startsWith('image/')&&n.url){const img=make('img','preview-media');img.src=n.url;img.alt=n.title;body.append(img);}else if((n.mime||'').startsWith('video/')&&n.url){const video=make('video','preview-media');video.src=n.url;video.controls=true;body.append(video);}else if(n.mime==='application/pdf'&&n.url){const iframe=make('iframe');iframe.src=n.url;iframe.title=n.title;iframe.style.cssText='width:100%;height:50vh;border:0';body.append(iframe);}else body.append(make('p','muted','此原型暂不支持该格式的本地预览。正式产品按文件类型接入预览与编辑能力。'));
$('#previewDialog').showModal();if(titleOnly)title.focus();}
$('#savePreview').onclick=()=>{const n=get(editing),title=$('#editTitle').value.trim();if(!title)return toast('标题不能为空');checkpoint();n.title=title;const t=$('#previewText');if(t)n.body=t.value;n.meta='已保存 · 本地演示';$('#previewDialog').close();render();toast('修改已保存，下次引用使用最新内容');};
function openSchedule(id){scheduleTarget=id;const n=get(id);if(!n)return;$('#scheduleSource').textContent='作用内容：'+n.title;$('#scheduleTitle').value='每周汇总 · '+n.title;$('#scheduleDialog').showModal();}
$('#scheduleForm').onsubmit=ev=>{ev.preventDefault();const n=get(scheduleTarget);if(!n)return;const title=$('#scheduleTitle').value.trim();if(!title)return toast('请输入任务名称');checkpoint();nodes.push({id:'auto-'+crypto.randomUUID(),title,type:'automation',scope:n.scope,project:n.project,parent:n.id,x:n.x+340,y:n.y+190,body:$('#scheduleAction').value,schedule:{frequency:$('#scheduleFrequency').value,time:$('#scheduleTime').value,timezone:'Asia/Shanghai',recipient:$('#scheduleRecipient').value,versionPolicy:'latest_saved'},meta:$('#scheduleFrequency').value+' '+$('#scheduleTime').value+' → '+$('#scheduleRecipient').value+' · 演示'});$('#scheduleDialog').close();render();toast('定时配置已保存；原型不会实际执行或发送');};
function switchTab(value){queries[tab]=$('#search').value;tab=value;$('#search').value=queries[tab];document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));renderTree();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('#search').oninput=renderTree;
$('#createForm').onsubmit=saveCreate;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
viewport.ondblclick=ev=>{if(ev.target.closest('.node'))return;ev.preventDefault();showMenu(ev.clientX,ev.clientY);};viewport.oncontextmenu=ev=>{ev.preventDefault();if(!ev.target.closest('.node'))showMenu(ev.clientX,ev.clientY);};
viewport.onpointerdown=ev=>{if(ev.target.closest('.node'))return;closeMenu();if(space||ev.button===1){drag={mode:'pan',x:ev.clientX,y:ev.clientY,pan:{...pan}};viewport.setPointerCapture(ev.pointerId);}else{selected=null;renderNodes();}};
viewport.onpointermove=ev=>{if(!drag)return;if(drag.mode==='pan'){pan.x=drag.pan.x+ev.clientX-drag.x;pan.y=drag.pan.y+ev.clientY-drag.y;transform();}else if(drag.mode==='node'){if(!drag.saved&&Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)>3){checkpoint();drag.saved=true;}const n=get(drag.id);n.x=drag.start.x+(ev.clientX-drag.x)/pan.z;n.y=drag.start.y+(ev.clientY-drag.y)/pan.z;const e=document.getElementById('node-'+n.id);e.style.left=n.x+'px';e.style.top=n.y+'px';renderEdges();}else{const p=point(ev.clientX,ev.clientY),a=get(drag.source);let line=$('#dragline');if(!line){line=document.createElementNS('http://www.w3.org/2000/svg','path');line.id='dragline';$('#edges').append(line);}line.setAttribute('d','M '+(a.x+228)+' '+(a.y+58)+' L '+p.x+' '+p.y);}};
viewport.onpointerup=ev=>{if(!drag)return;const old=drag;drag=null;if(viewport.hasPointerCapture(ev.pointerId))viewport.releasePointerCapture(ev.pointerId);if(old.mode==='connect'){const hit=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.node');if(hit){const target=hit.dataset.nodeId;if(target!==old.source){checkpoint();if(!links.some(l=>l.from===old.source&&l.to===target))links.push({from:old.source,to:target});toast('已建立关联，内容归属保持原样');}else toast('不能连接到自身');renderEdges();}else{renderEdges();showMenu(ev.clientX,ev.clientY,old.source);}}};
viewport.onwheel=ev=>{ev.preventDefault();zoom(ev.deltaY<0?1.08:1/1.08,ev.clientX,ev.clientY);};$('#zoomIn').onclick=()=>zoom(1.15);$('#zoomOut').onclick=()=>zoom(1/1.15);$('#fit').onclick=()=>center(descendants(selected||'root-after'));$('#back').onclick=()=>{if(history.length)pan=history.pop();$('#back').disabled=!history.length;transform();};
document.addEventListener('pointerdown',ev=>{if(!ev.target.closest('#menu')&&!ev.target.closest('.node'))closeMenu();});
document.addEventListener('keydown',ev=>{const editingField=ev.target.matches('input,textarea,select')||document.querySelector('dialog[open]');if(editingField)return;if(ev.code==='Space'){space=true;ev.preventDefault();}if(ev.key==='Escape'){closeMenu();}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();const old=undo.pop();if(old){const state=JSON.parse(old);nodes=state.nodes;links=state.links;render();toast('已撤销本地操作');}}if(selected&&['Tab','Enter','F2'].includes(ev.key)){ev.preventDefault();const n=get(selected);if(!n)return;if(ev.key==='F2')return rename(n.id);const parent=ev.key==='Tab'?n.id:n.parent;openCreate('topic',{x:ev.key==='Tab'?n.x+335:n.x,y:n.y+170},parent);}});
document.addEventListener('keyup',ev=>{if(ev.code==='Space')space=false;});window.addEventListener('blur',()=>{space=false;drag=null;});
$('#reset').onclick=()=>{nodes=structuredClone(initial);links=[];undo=[];collapsed.clear();selected=null;project='project-a';switchTab('project');$('#search').value='';render();center(descendants('root-after'),false);toast('已恢复示例');};
render();center(descendants('root-after'),false);
window.__kbPrototype={getState:()=>({nodes:structuredClone(nodes),links:structuredClone(links),pan:{...pan},tab,project}),locate};
})();
</script>
</body></html>
