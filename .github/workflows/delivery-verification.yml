name: Verify release credentials
on:
  push:
    tags: ['delivery-verification/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: everydayaione-credential-verification
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/delivery-verification/diagnostics-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read-only dedicated SSH and gateway verification
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_APPROVER: ${{ vars.DELIVERY_APPROVER }}
          DELIVERY_CONFIG_JSON: ${{ secrets.DELIVERY_CONFIG_JSON }}
          DELIVERY_SSH_KEY: ${{ secrets.DELIVERY_SSH_KEY }}
          DELIVERY_KNOWN_HOSTS: ${{ secrets.DELIVERY_KNOWN_HOSTS }}
        run: python3 scripts/ci/verify_delivery.py
