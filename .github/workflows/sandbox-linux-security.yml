name: Sandbox Linux security contract

on:
  workflow_dispatch:
  push:
    branches:
      - feature/agent-runtime-ar-16-phase2-executors
    paths:
      - ".github/workflows/sandbox-linux-security.yml"
      - "backend/services/agent/runtime/sandbox/**"
      - "backend/tests/test_agent_runtime_sandbox_linux_external.py"

permissions:
  contents: read

concurrency:
  group: sandbox-linux-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NSJAIL_COMMIT: 079d70dda4aa1edd9512cfd25ff1e47e316dc355
      SANDBOX_ROOTFS: /tmp/everydayai-sandbox-rootfs
      SANDBOX_SECCOMP_POLICY: /tmp/everydayai-sandbox.policy
      RUN_SANDBOX_LINUX_EXTERNAL_TESTS: "1"

    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install fixed build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf bison debootstrap flex g++ gcc git libcap-dev \
            libnl-route-3-dev libprotobuf-dev make pkg-config \
            protobuf-compiler python3-venv

      - name: Build pinned nsjail
        run: |
          set -euo pipefail
          git init /tmp/nsjail
          git -C /tmp/nsjail remote add origin https://github.com/google/nsjail.git
          git -C /tmp/nsjail fetch --depth=1 origin "$NSJAIL_COMMIT"
          git -C /tmp/nsjail checkout --detach FETCH_HEAD
          git -C /tmp/nsjail submodule update --init --recursive --depth=1
          make -C /tmp/nsjail -j2
          sudo install -m 0755 /tmp/nsjail/nsjail /usr/local/bin/nsjail
          nsjail --help > /tmp/nsjail-help.txt 2>&1
          head -n 3 /tmp/nsjail-help.txt

      - name: Build disposable rootfs
        run: |
          set -euo pipefail
          sudo debootstrap --variant=minbase --include=python3-minimal \
            noble "$SANDBOX_ROOTFS" http://archive.ubuntu.com/ubuntu/
          sudo mkdir -p \
            "$SANDBOX_ROOTFS/job/input" \
            "$SANDBOX_ROOTFS/job/output"
          cat > "$SANDBOX_SECCOMP_POLICY" <<'EOF'
          ERRNO(1) { getppid }
          DEFAULT ALLOW
          EOF

      - name: Record Linux isolation capabilities
        run: |
          set -euo pipefail
          uname -a
          stat -fc %T /sys/fs/cgroup
          cat /sys/fs/cgroup/cgroup.controllers
          nsjail --help 2>&1 | grep -E -- \
            '--use_cgroupv2|--cgroup_mem_max|--cgroup_pids_max|--cgroup_cpu_ms_per_sec'

      - name: Run real nsjail contract
        working-directory: backend
        run: |
          set -euo pipefail
          python3 -m venv /tmp/everydayai-sandbox-test-venv
          /tmp/everydayai-sandbox-test-venv/bin/pip install \
            pytest==8.3.4 pytest-asyncio==0.25.2
          sudo --preserve-env=SANDBOX_ROOTFS,SANDBOX_SECCOMP_POLICY,RUN_SANDBOX_LINUX_EXTERNAL_TESTS \
            /tmp/everydayai-sandbox-test-venv/bin/python -m pytest \
            -q --tb=short -p no:warnings -p testing.pytest_policy \
            -m external tests/test_agent_runtime_sandbox_linux_external.py

      - name: Verify zero runtime residue
        if: always()
        run: |
          set -euo pipefail
          if pgrep -fa '[n]sjail'; then
            echo "Residual nsjail process detected" >&2
            exit 1
          fi
          if find /sys/fs/cgroup -maxdepth 3 -iname '*nsjail*' -print -quit \
            | grep -q .; then
            echo "Residual nsjail cgroup detected" >&2
            exit 1
          fi
          sudo rm -rf \
            "$SANDBOX_ROOTFS" \
            /tmp/everydayai-sandbox-test-venv \
            /tmp/nsjail \
            "$SANDBOX_SECCOMP_POLICY"
          test ! -e "$SANDBOX_ROOTFS"
