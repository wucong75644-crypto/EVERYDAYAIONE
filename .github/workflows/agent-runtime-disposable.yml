name: Agent Runtime Disposable Verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/agent-runtime-disposable.yml"
      - "backend/agent_runtime_worker_main.py"
      - "backend/wecom_ws_runner.py"
      - "backend/api/routes/message_chat_preparation.py"
      - "backend/api/routes/message_image_preparation.py"
      - "backend/api/routes/message_video_preparation.py"
      - "backend/api/routes/message_media_failure.py"
      - "backend/core/config.py"
      - "backend/core/db_scope.py"
      - "backend/core/redis.py"
      - "backend/services/adapters/kie/client.py"
      - "backend/services/configuration/**"
      - "backend/migrations/227_*.sql"
      - "backend/migrations/rollback/227_*.sql"
      - "backend/migrations/217_*.sql"
      - "backend/migrations/rollback/217_*.sql"
      - "backend/migrations/228_*.sql"
      - "backend/migrations/rollback/228_*.sql"
      - "backend/services/agent/runtime/**"
      - "backend/services/agent/tool_executor.py"
      - "backend/services/async_retry_service.py"
      - "backend/services/background_task_worker.py"
      - "backend/services/media_tool_executor.py"
      - "backend/services/task_completion_service.py"
      - "backend/services/handlers/image_handler.py"
      - "backend/services/handlers/image_request_settings.py"
      - "backend/services/handlers/image_prepared_submission.py"
      - "backend/services/handlers/video_prepared_submission.py"
      - "backend/services/wecom/**"
      - "backend/tests/test_agent_runtime_*.py"
      - "backend/tests/agent_runtime_ar173_specialist_test_support.py"
      - "backend/tests/agent_runtime_deploy_test_support.py"
      - "backend/tests/agent_runtime_kie_media_provider_test_support.py"
      - "backend/tests/agent_runtime_media_manifest_test_support.py"
      - "backend/tests/scheduled_tasks_routes_cases.py"
      - "backend/tests/scheduled_tasks_routes_test_support.py"
      - "backend/tests/wecom_message_service_test_support.py"
      - "backend/tests/test_artifact_runtime.py"
      - "backend/tests/test_message_chat_preparation.py"
      - "backend/tests/test_image_runtime_request_guardrails.py"
      - "backend/tests/test_wecom_actor_enqueue.py"
      - "backend/tests/test_scheduled_wecom_*.py"
      - "backend/tests/test_wecom_ws_runner*.py"
      - "scripts/run_agent_runtime_ar18_disposable.sh"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/components/chat/media/AiImageGrid.tsx"
      - "frontend/src/constants/mediaOptions.ts"
      - "frontend/src/constants/__tests__/models.test.ts"
      - "frontend/src/components/chat/message/MessageMedia.tsx"
      - "frontend/src/services/messageSender.ts"
      - "frontend/src/services/__tests__/messageSenderRetry.test.ts"
      - "frontend/src/components/chat/__tests__/AiImageGrid.test.tsx"
      - "frontend/src/components/chat/__tests__/MessageMedia.test.tsx"
      - "frontend/src/components/chat/__tests__/RuntimeMediaMessageItem.test.tsx"
      - "frontend/src/contexts/wsTaskMessageHandlers.ts"
      - "frontend/src/contexts/__tests__/wsRuntimeMediaSlots.test.ts"
      - "frontend/src/schemas/messageProtocol.ts"
      - "frontend/src/schemas/__tests__/messageProtocol.test.ts"
      - "frontend/src/utils/runtimeMediaSlots.ts"
      - "frontend/src/utils/__tests__/runtimeMediaSlots.test.ts"
      - "deploy/everydayai-agent-*.service"
      - "deploy/everydayai-wecom.service"
      - "deploy/everydayai-sandbox-worker.service"
      - "deploy/env-templates/agent-*.env.template"
      - "deploy/env-templates/sandbox-worker.env.template"
      - "deploy/env-templates/wecom-runtime.env.template"
      - "deploy/*.sh"
      - "deploy/provision-control-plane-worker-envs.py"
      - "deploy/control_plane_env_source.py"
      - "deploy/bootstrap-agent-model-gateway-role.sh"
      - "deploy/DEPLOYMENT.md"
      - "docs/database/MIGRATION_GUIDE.md"
      - "docs/PROJECT_OVERVIEW.md"
      - "docs/FUNCTION_INDEX.md"
      - "docs/AGENT_RUNTIME_PRODUCTION_RUNBOOK.md"
      - "docs/document/AR17_STAGING_PROVISIONING.md"
      - "docs/document/TECH_AGENT_RUNTIME_SINGLE_RUNTIME_CONVERGENCE.md"
      - "scripts/check_task_change.py"

permissions:
  contents: read

concurrency:
  group: 'agent-runtime-disposable-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  disposable-runtime:
    name: Single Runtime Disposable Flags-off Candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: -p no:cacheprovider
      RUN_AR17_1_DB_TEST: "1"
      AGENT_RUNTIME_INGRESS_ENABLED: "false"
      AGENT_RUNTIME_PRODUCTION_COMPOSITION_ENABLED: "false"
      AGENT_RUNTIME_SCHEDULED_WECOM_ENABLED: "false"
      AGENT_RUNTIME_MEDIA_ENABLED: "false"
      AGENT_RUNTIME_MEDIA_PROVIDER_PROBE_PASSED: "false"
      AGENT_RUNTIME_MEDIA_PRODUCTION_READY: "false"
      C7_QUALITY_BASELINE: "25513882a76efdfc77cc9ea6031ed1d52282f18b"

    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Verify candidate and production gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$AGENT_RUNTIME_INGRESS_ENABLED" = false
          test "$AGENT_RUNTIME_PRODUCTION_COMPOSITION_ENABLED" = false
          test "$AGENT_RUNTIME_SCHEDULED_WECOM_ENABLED" = false
          test "$AGENT_RUNTIME_MEDIA_ENABLED" = false
          test "$AGENT_RUNTIME_MEDIA_PROVIDER_PROBE_PASSED" = false
          test "$AGENT_RUNTIME_MEDIA_PRODUCTION_READY" = false
          test -z "${KIE_API_KEY:-}"
          git cat-file -e "$C7_QUALITY_BASELINE^{commit}"

      - name: Configure disposable Python environment
        run: echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/ar17-pyc" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql postgresql-client python3-venv
          sudo mkdir -p /private/tmp /opt/homebrew/bin
          sudo chmod 1777 /private/tmp
          bindir="$(pg_config --bindir)"
          echo "AGENT_RUNTIME_PG_BIN_DIR=$bindir" >> "$GITHUB_ENV"
          sudo ln -sf "$bindir/initdb" /opt/homebrew/bin/initdb
          sudo ln -sf "$bindir/pg_ctl" /opt/homebrew/bin/pg_ctl
          sudo ln -sf "$bindir/postgres" /opt/homebrew/bin/postgres

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ar17-venv"
          "$RUNNER_TEMP/ar17-venv/bin/pip" install --disable-pip-version-check \
            -r backend/requirements.txt
          echo "$RUNNER_TEMP/ar17-venv/bin" >> "$GITHUB_PATH"

      - name: Configure frontend Node environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/ar17-evidence"

      - name: Run single Runtime model contracts
        run: |
          set -euo pipefail
          pytest -q \
            backend/tests/test_agent_runtime_single_model_adapter.py \
            backend/tests/test_agent_runtime_model_configuration_facade_migration.py \
            backend/tests/test_agent_runtime_model_loop_budget_outcome.py \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/single-runtime-model.log"

      - name: Run Runtime correction and unit contracts
        run: |
          set -euo pipefail
          pytest -q \
            backend/tests/test_agent_runtime_model_resolution.py \
            backend/tests/test_agent_runtime_c21_erp_scope.py \
            backend/tests/test_agent_runtime_ingress_adapter_compatibility.py \
            backend/tests/test_message_chat_preparation.py \
            backend/tests/test_wecom_actor_enqueue.py \
            backend/tests/test_agent_runtime_c52_safe_composition.py \
            backend/tests/test_agent_runtime_data_adapters.py \
            backend/tests/test_agent_runtime_local_query_migration.py \
            backend/tests/test_agent_runtime_worker_readiness.py \
            backend/tests/test_agent_runtime_process_settings.py \
            backend/tests/test_agent_runtime_flags_off_install.py \
            backend/tests/test_agent_runtime_control_plane_update.py \
            backend/tests/test_agent_runtime_control_plane_env_transaction.py \
            backend/tests/test_tenant_db_env_contract.py \
            backend/tests/test_deploy_service_contract.py \
            backend/tests/test_agent_runtime_a6_composition.py \
            backend/tests/test_agent_runtime_projection_redis_settings.py \
            backend/tests/test_agent_runtime_sandbox_composition_contract.py \
            backend/tests/test_agent_runtime_production_process_contract.py \
            backend/tests/test_agent_runtime_t177_credential_boundary.py \
            backend/tests/test_agent_runtime_credential_broker.py \
            backend/tests/test_agent_runtime_observability.py \
            backend/tests/test_agent_runtime_status_snapshot.py \
            backend/tests/test_agent_runtime_provider_facts.py \
            backend/tests/test_agent_runtime_erp_adapter.py \
            backend/tests/test_agent_runtime_media_completion.py \
            backend/tests/test_agent_runtime_scheduler_cas.py \
            backend/tests/test_agent_runtime_a9_nonproduction_backends.py \
            backend/tests/test_agent_runtime_a10_nonproduction_composition.py \
            backend/tests/test_agent_runtime_action_loop_gate.py \
            backend/tests/test_agent_runtime_coordinator_recovery.py \
            backend/tests/test_agent_runtime_ar18_owner_dry_run.py \
            backend/tests/test_agent_runtime_recovery_center_migration.py \
            backend/tests/test_agent_runtime_cost_side_effect_observability_migration.py \
            backend/tests/test_agent_runtime_c7_b32a_safe_release.py \
            backend/tests/test_agent_runtime_c7_b32a_migration.py \
            backend/tests/test_agent_runtime_data_read_release.py \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/unit.log"

      - name: Run Artifact, Workspace, Child Run and specialist contracts
        if: always()
        run: |
          set -euo pipefail
          pytest -q \
            backend/tests/test_agent_runtime_ar173_specialists.py \
            backend/tests/test_agent_runtime_ar174_production_closure.py \
            backend/tests/test_artifact_runtime.py \
            backend/tests/test_agent_runtime_sandbox_workspace.py \
            -k 'not isolated_harness_invokes_all_23_distinct_provider_adapters and not http_mock_server_proves_media_query_and_cancel_semantics' \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/services.log"

      - name: Run AR-18 cancel, scheduler, finalizer and ModelAttempt unit contracts
        if: always()
        run: |
          set -euo pipefail
          bash scripts/run_agent_runtime_ar18_disposable.sh unit \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/ar18-unit.log"

      - name: Run AR-18 migration order and rollback contracts
        if: always()
        run: |
          set -euo pipefail
          bash scripts/run_agent_runtime_ar18_disposable.sh migration \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/ar18-migration.log"

      - name: Run AR-18 disposable PostgreSQL contracts
        if: always()
        run: |
          set -euo pipefail
          bash scripts/run_agent_runtime_ar18_disposable.sh external \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/ar18-postgres.log"

      - name: Run Scheduled WeCom runner and runtime unit contracts
        if: always()
        run: |
          set -euo pipefail
          pytest -q \
            backend/tests/test_wecom_ws_runner.py \
            backend/tests/test_wecom_ws_runner_main.py \
            backend/tests/test_agent_runtime_scheduled_wecom_worker.py \
            backend/tests/test_agent_runtime_scheduled_wecom_worker_reconcile_priority.py \
            backend/tests/test_agent_runtime_scheduled_wecom_reconcile_service.py \
            backend/tests/test_agent_runtime_scheduled_wecom_reconcile_org_repository.py \
            backend/tests/test_scheduled_wecom_runtime_composition.py \
            backend/tests/test_agent_runtime_scheduled_wecom_router.py \
            backend/tests/test_agent_runtime_scheduled_wecom_prepared_router.py \
            backend/tests/test_agent_runtime_scheduled_wecom_repository.py \
            backend/tests/test_agent_runtime_scheduled_wecom_repository_contract.py \
            backend/tests/test_agent_runtime_scheduled_wecom_repository_payload.py \
            backend/tests/test_agent_runtime_scheduled_wecom_started_recovery_repository.py \
            backend/tests/test_agent_runtime_scheduled_wecom_app_dispatch.py \
            backend/tests/test_agent_runtime_scheduled_wecom_app_dispatch_concurrency.py \
            backend/tests/test_agent_runtime_scheduled_wecom_app_prepared_resume.py \
            backend/tests/test_agent_runtime_scheduled_wecom_smart_dispatch.py \
            backend/tests/test_agent_runtime_scheduled_wecom_smart_prepared_resume.py \
            backend/tests/test_agent_runtime_scheduled_wecom_smart_transport_resolution.py \
            backend/tests/test_scheduled_wecom_app_binding.py \
            backend/tests/test_scheduled_wecom_app_binding_lifecycle.py \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/scheduled-wecom-unit.log"

      - name: Run disposable PostgreSQL migration and security contracts
        if: always()
        run: |
          set -euo pipefail
          pytest -q -m external \
            backend/tests/test_agent_runtime_ar174_postgres_external.py \
            backend/tests/test_agent_runtime_ar174_a7_provider_binding_postgres_external.py \
            backend/tests/test_agent_runtime_ar174_a2_postgres_external.py \
            backend/tests/test_agent_runtime_a8_scheduler_cas_postgres_external.py \
            backend/tests/test_agent_runtime_recovery_center_postgres_external.py \
            backend/tests/test_agent_runtime_cost_side_effect_observability_postgres_external.py \
            backend/tests/test_agent_runtime_additive_ingress_compatibility_postgres_external.py \
            backend/tests/test_agent_runtime_owner_transition_postgres_external.py \
            backend/tests/test_agent_runtime_owner_rpc_acl_closure_postgres_external.py \
            backend/tests/test_agent_runtime_c7_b32a_postgres_external.py \
            backend/tests/test_agent_runtime_local_query_postgres_external.py \
            backend/tests/test_agent_runtime_data_read_release_postgres_external.py \
            backend/tests/test_agent_runtime_model_configuration_facade_postgres_external.py \
            backend/tests/test_agent_runtime_pgcrypto_migration.py \
            backend/tests/test_agent_runtime_ar18_migration_continuity_postgres_external.py \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/postgres.log"

      - name: Collect disposable PostgreSQL server logs
        if: ${{ failure() }}
        run: |
          set +e
          for logfile in /private/tmp/ar17-1-pg-*/postgres.log; do
            test -f "$logfile" || continue
            echo "===== $logfile ====="
            sed -n '1,240p' "$logfile"
          done

      - name: Run local HTTP mock harness
        if: always()
        run: |
          set -euo pipefail
          pytest -q \
            backend/tests/test_agent_runtime_ar173_specialists.py::test_isolated_harness_invokes_all_23_distinct_provider_adapters \
            backend/tests/test_agent_runtime_ar173_specialists.py::test_http_mock_server_proves_media_query_and_cancel_semantics \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/http-mock.log"

      - name: Run Runtime media frontend contracts and build
        if: always()
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run test:run -- \
            src/components/chat/__tests__/AiImageGrid.test.tsx \
            src/components/chat/__tests__/MessageMedia.test.tsx \
            src/components/chat/__tests__/RuntimeMediaMessageItem.test.tsx \
            src/contexts/__tests__/wsRuntimeMediaSlots.test.ts \
            src/schemas/__tests__/messageProtocol.test.ts \
            src/utils/__tests__/runtimeMediaSlots.test.ts \
            src/services/__tests__/messageSenderRetry.test.ts \
            src/constants/__tests__/models.test.ts \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/runtime-media-frontend.log"
          npm run build \
            2>&1 | tee "$RUNNER_TEMP/ar17-evidence/runtime-media-frontend-build.log"

      - name: Run migration and quality checks
        if: always()
        run: |
          set -euo pipefail
          {
            python -m compileall -q \
              backend/agent_runtime_worker_main.py \
              backend/wecom_ws_runner.py \
              backend/services/agent/runtime \
              backend/services/wecom
            pytest -q \
              backend/tests/test_agent_runtime_ar17_migration.py \
              backend/tests/test_agent_runtime_provider_submission_migration.py \
              backend/tests/test_agent_runtime_production_composition_migration.py \
              backend/tests/test_agent_runtime_action_migration_order.py \
              backend/tests/test_agent_runtime_role_grants_migration.py \
              backend/tests/test_agent_runtime_recovery_center_migration.py \
              backend/tests/test_agent_runtime_cost_side_effect_observability_migration.py \
              backend/tests/test_agent_runtime_additive_ingress_compatibility_migration.py \
              backend/tests/test_agent_runtime_owner_rpc_acl_closure_migration.py \
              backend/tests/test_agent_runtime_c7_b32a_migration.py \
              backend/tests/test_agent_runtime_data_read_release.py
            pytest -q \
              backend/tests/test_agent_runtime_scheduled_wecom_delivery_foundation_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_claim_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_dispatch_prepare_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_dispatch_outcome_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_reconcile_claim_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_continuation_claim_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_reconcile_definitive_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_dispatch_version_readback_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_dispatch_payload_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_unsupported_terminalization_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_started_recovery_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_unicode_payload_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_configuration_facade_migration.py \
              backend/tests/test_agent_runtime_scheduled_wecom_prepared_payload_migration.py
            pytest -q \
              backend/tests/test_agent_runtime_scheduled_wecom_reconcile_org_migration.py
            pytest -q -m 'not external' \
              backend/tests/test_agent_runtime_pgcrypto_migration.py \
              backend/tests/test_migration_runner.py
            git diff --check
            mapfile -t c7_candidate_files < <(
              git diff --name-only --diff-filter=ACMR \
                "$C7_QUALITY_BASELINE"...HEAD --
            )
            test "${#c7_candidate_files[@]}" -gt 0
            python scripts/check_task_change.py --files "${c7_candidate_files[@]}"
          } 2>&1 | tee "$RUNNER_TEMP/ar17-evidence/security-quality.log"

      - name: Record verification summary
        if: always()
        run: |
          {
            echo "result=${{ job.status == 'success' && 'Single Runtime Disposable Flags-off Candidate Verified' || 'Single Runtime Disposable Flags-off Candidate Not Verified' }}"
            echo "verification_scope=local disposable CI contract only"
            echo "staging_verified=false"
            echo "production_verified=false"
            echo "production_ready=false"
            echo "commit=$(git rev-parse HEAD)"
            git status --short --branch
          } > "$RUNNER_TEMP/ar17-evidence/summary.txt"

      - name: Upload disposable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-disposable-${{ github.sha }}
          path: ${{ runner.temp }}/ar17-evidence
          if-no-files-found: error
          retention-days: 14
