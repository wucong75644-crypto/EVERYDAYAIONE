<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIE 视频播放器</title><style>
:root{color-scheme:light dark;font:14px system-ui}body{margin:0;padding:16px}video{display:block;width:100%;max-height:65vh;background:#111;border-radius:10px}p{line-height:1.6}a{color:inherit}#links a{display:inline-block;margin:8px 16px 0 0}
</style></head><body><p id="status">正在连接播放器…</p><video id="video" controls playsinline preload="metadata" hidden></video><nav id="links"></nav>
<script>
'use strict';
const status=document.getElementById('status'),video=document.getElementById('video'),links=document.getElementById('links');
let ready=false,hostOrigin;
function send(message){window.parent.postMessage({jsonrpc:'2.0',...message},hostOrigin||'*');}
function safe(value){try{const u=new URL(value);return u.origin==='https://cdn.everydayai.com.cn'&&!u.username&&!u.password&&u.pathname.startsWith('/personal/')&&u.pathname.endsWith('.mp4')&&!u.search&&!u.hash;}catch{return false;}}
function render(data){
 links.replaceChildren();video.pause();video.removeAttribute('src');video.hidden=true;
 const urls=(data.video_urls||[]).filter(safe);
 if(!urls.length){status.textContent=data.state==='success'?'视频已生成，正在准备永久播放地址。请稍后再次展示。':'视频尚未生成完成。';return;}
 video.src=urls[0];video.hidden=false;status.textContent='视频已就绪，点击播放。';
 urls.forEach((url,index)=>{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='打开 / 保存视频 '+(index+1);links.append(a);});
}
window.addEventListener('message',event=>{
 if(event.source!==window.parent||!event.data||event.data.jsonrpc!=='2.0')return;
 const message=event.data;
 if(message.id===1&&message.result&&!ready){hostOrigin=event.origin==='null'?undefined:event.origin;ready=true;send({method:'ui/notifications/initialized'});status.textContent='等待视频结果…';return;}
 if(!ready)return;
 if(message.method==='ui/notifications/tool-result'){
  const result=message.params;let data=result.structuredContent;
  if(!data){try{data=JSON.parse(result.content.find(c=>c.type==='text').text);}catch{status.textContent='无法读取视频结果。';return;}}
  render(data);
 }
 if(message.method==='ui/resource-teardown'){video.pause();send({id:message.id,result:{}});}
});
video.addEventListener('error',()=>{status.textContent='当前客户端无法播放，请使用下方链接打开视频。';});
new ResizeObserver(()=>{if(ready)send({method:'ui/notifications/size-changed',params:{height:document.body.scrollHeight}});}).observe(document.body);
if(window.parent!==window)send({id:1,method:'ui/initialize',params:{protocolVersion:'2026-01-26',appInfo:{name:'KIE Video Player',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline']}}});
else status.textContent='请通过 MCP 的 show_video 工具打开播放器。';
</script></body></html>
