name: Codex requested delivery
run-name: Delivery · ${{ github.ref_name }}

on:
  push:
    tags: ['delivery-rehearsal/**', 'delivery-production/**', 'delivery-accept/**']

permissions:
  contents: read
  actions: read

# FIFO by time entering this group, maximum 100 waiting requests. Do not cancel
# an in-flight deployment, replace a waiting request, or split this by branch.
# Acceptance has a separate queue so task B waiting for deployment cannot block
# task A's acceptance. Both writers still require the same server-side lock.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/delivery-accept/') && 'everydayaione-production-acceptance' || 'everydayaione-production-delivery' }}
  queue: max
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.plan.outputs.sha }}
      branch: ${{ steps.plan.outputs.branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact successful checks, current task and request identity and environment policy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_DELIVERY_ENABLED: ${{ vars.PRODUCTION_DELIVERY_ENABLED }}
          DELIVERY_APPROVER: ${{ vars.DELIVERY_APPROVER }}
        run: python3 scripts/ci/delivery.py plan

  rehearsal:
    if: needs.plan.outputs.mode == 'rehearsal'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: delivery-rehearsal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Exercise real release entry with temporary Git and fake SSH only
        run: |
          python -m pip install pyyaml==6.0.2
          python -m unittest scripts/testing/test_delivery.py scripts/testing/test_release_coordination.py scripts/testing/test_task_delivery.py scripts/testing/test_ssh_gateway.py -v
          printf 'Rehearsal passed; no production credentials, SSH connection or data access.\n' >> "$GITHUB_STEP_SUMMARY"

  production:
    if: needs.plan.outputs.mode == 'production' && vars.PRODUCTION_DELIVERY_ENABLED == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Revalidate the explicit Codex request and invoke controlled release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_DELIVERY_ENABLED: ${{ vars.PRODUCTION_DELIVERY_ENABLED }}
          DELIVERY_APPROVER: ${{ vars.DELIVERY_APPROVER }}
          DELIVERY_CONFIG_JSON: ${{ secrets.DELIVERY_CONFIG_JSON }}
          DELIVERY_SSH_KEY: ${{ secrets.DELIVERY_SSH_KEY }}
          DELIVERY_KNOWN_HOSTS: ${{ secrets.DELIVERY_KNOWN_HOSTS }}
        run: python3 scripts/ci/delivery.py execute

  acceptance:
    if: needs.plan.outputs.mode == 'accept' && vars.PRODUCTION_DELIVERY_ENABLED == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact production candidate, accept and close runner worktree
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_DELIVERY_ENABLED: ${{ vars.PRODUCTION_DELIVERY_ENABLED }}
          DELIVERY_APPROVER: ${{ vars.DELIVERY_APPROVER }}
          DELIVERY_CONFIG_JSON: ${{ secrets.DELIVERY_CONFIG_JSON }}
          DELIVERY_SSH_KEY: ${{ secrets.DELIVERY_SSH_KEY }}
          DELIVERY_KNOWN_HOSTS: ${{ secrets.DELIVERY_KNOWN_HOSTS }}
        run: python3 scripts/ci/delivery.py execute
