name: Sandbox Linux security contract
run-name: Sandbox Linux security contract @ ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - feature/agent-runtime-ar-16-phase2-executors
      - codex/agent-runtime-final-integration
    paths:
      - ".github/workflows/sandbox-linux-security.yml"
      - "backend/migrations/223_agent_runtime_production_composition.sql"
      - "backend/migrations/rollback/223_agent_runtime_production_composition_rollback.sql"
      - "backend/services/agent/runtime/sandbox/**"
      - "backend/tests/test_agent_runtime_sandbox_linux_external.py"
      - "deploy/everydayai-sandbox-worker.service"
      - "deploy/preflight-agent-runtime-release.sh"
      - "deploy/provision-runtime-users.sh"
      - "deploy/runtime-capability-probe.sh"
      - "deploy/sandbox-job.policy"

permissions:
  contents: read

concurrency:
  group: sandbox-linux-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NSJAIL_COMMIT: 079d70dda4aa1edd9512cfd25ff1e47e316dc355
      SANDBOX_ROOTFS: /tmp/everydayai-sandbox-rootfs
      SANDBOX_SECCOMP_POLICY: ${{ github.workspace }}/deploy/sandbox-job.policy
      SANDBOX_ROOTFS_MANIFEST: /tmp/everydayai-sandbox-rootfs.manifest
      SANDBOX_NSJAIL_PATH: /usr/local/bin/nsjail
      SANDBOX_CGROUP_V2_MOUNT: /sys/fs/cgroup
      SANDBOX_HOST_MARKER: /sandbox-host-secret-everydayai-contract
      RUN_SANDBOX_LINUX_EXTERNAL_TESTS: "1"

    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify checked out candidate
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install fixed build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf bison debootstrap flex g++ gcc git libcap-dev \
            libnl-route-3-dev libprotobuf-dev make pkg-config \
            protobuf-compiler python3-venv

      - name: Build pinned nsjail
        run: |
          set -euo pipefail
          git init /tmp/nsjail
          git -C /tmp/nsjail remote add origin https://github.com/google/nsjail.git
          git -C /tmp/nsjail fetch --depth=1 origin "$NSJAIL_COMMIT"
          git -C /tmp/nsjail checkout --detach FETCH_HEAD
          git -C /tmp/nsjail submodule update --init --recursive --depth=1
          make -C /tmp/nsjail -j2
          sudo install -m 0755 /tmp/nsjail/nsjail /usr/local/bin/nsjail
          echo "SANDBOX_NSJAIL_SHA256=$(sha256sum /usr/local/bin/nsjail | cut -d' ' -f1)" >> "$GITHUB_ENV"
          nsjail --help > /tmp/nsjail-help.txt 2>&1
          head -n 3 /tmp/nsjail-help.txt

      - name: Build disposable rootfs
        run: |
          set -euo pipefail
          sudo debootstrap --variant=minbase --include=python3 \
            noble "$SANDBOX_ROOTFS" http://archive.ubuntu.com/ubuntu/
          sudo mkdir -p \
            "$SANDBOX_ROOTFS/job/input" \
            "$SANDBOX_ROOTFS/job/output"
          sudo python3 backend/services/agent/runtime/sandbox/rootfs_manifest.py \
            create "$SANDBOX_ROOTFS" "$SANDBOX_ROOTFS_MANIFEST"
          sudo chown "$USER:$USER" "$SANDBOX_ROOTFS_MANIFEST"
          sudo mount --bind "$SANDBOX_ROOTFS" "$SANDBOX_ROOTFS"
          sudo mount -o remount,bind,ro "$SANDBOX_ROOTFS"
          echo "SANDBOX_ROOTFS_SHA256=$(sha256sum "$SANDBOX_ROOTFS_MANIFEST" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SANDBOX_SECCOMP_SHA256=$(sha256sum "$SANDBOX_SECCOMP_POLICY" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Record Linux isolation capabilities
        run: |
          set -euo pipefail
          uname -a
          stat -fc %T /sys/fs/cgroup
          cat /sys/fs/cgroup/cgroup.controllers
          nsjail --help 2>&1 | grep -E -- \
            '--use_cgroupv2|--cgroup_mem_max|--cgroup_pids_max|--cgroup_cpu_ms_per_sec'

      - name: Prepare non-root Sandbox worker contract
        run: |
          set -euo pipefail
          sudo groupadd --system everydayai-sandbox
          sudo useradd --system --no-create-home \
            --shell /usr/sbin/nologin --gid everydayai-sandbox \
            everydayai-sandbox
          sandbox_uid=$(id -u everydayai-sandbox)
          sandbox_gid=$(id -g everydayai-sandbox)
          test "$sandbox_uid" -ne 0
          test "$sandbox_gid" -ne 0
          sudo touch "$SANDBOX_HOST_MARKER"
          sudo chmod 0600 "$SANDBOX_HOST_MARKER"
          sudo mkdir /sys/fs/cgroup/everydayai-sandbox-contract
          sudo chown "$sandbox_uid:$sandbox_gid" \
            /sys/fs/cgroup/everydayai-sandbox-contract
          sudo mkdir /tmp/everydayai-sandbox-worker
          sudo chown "$sandbox_uid:$sandbox_gid" \
            /tmp/everydayai-sandbox-worker
          echo "SANDBOX_CGROUP_V2_MOUNT=/sys/fs/cgroup/everydayai-sandbox-contract" \
            >> "$GITHUB_ENV"

      - name: Run real nsjail contract
        working-directory: backend
        run: |
          set -euo pipefail
          python3 -m venv /tmp/everydayai-sandbox-test-venv
          /tmp/everydayai-sandbox-test-venv/bin/pip install \
            pytest==8.3.4 pytest-asyncio==0.25.2
          set +e
          runuser --preserve-environment -u everydayai-sandbox -- \
            /tmp/everydayai-sandbox-test-venv/bin/python -m pytest \
            -q --tb=short -p no:warnings -p testing.pytest_policy \
            -m external tests/test_agent_runtime_sandbox_linux_external.py \
            2>&1 | tee /tmp/everydayai-sandbox-contract.log
          contract_rc=${PIPESTATUS[0]}
          set -e
          if [ "$contract_rc" -ne 0 ]; then
            {
              echo "### Sandbox Linux contract failure"
              echo '```text'
              tail -n 80 /tmp/everydayai-sandbox-contract.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 80 /tmp/everydayai-sandbox-contract.log |
              tr '\n' ' ' | sed 's/%/%25/g;s/\\r/%0D/g')
            echo "::error title=Sandbox Linux contract failed::$diagnostic"
          fi
          exit "$contract_rc"

      - name: Verify zero runtime residue
        if: always()
        run: |
          set -euo pipefail
          residue=0
          if pgrep -fa '[n]sjail'; then
            echo "Residual nsjail process detected" >&2
            residue=1
          fi
          if find /sys/fs/cgroup -maxdepth 3 -iname '*nsjail*' -print -quit \
            | grep -q .; then
            echo "Residual nsjail cgroup detected" >&2
            sudo find /sys/fs/cgroup -maxdepth 3 -iname '*nsjail*' -print >&2
            residue=1
          fi
          mountpoint -q "$SANDBOX_ROOTFS" && sudo umount "$SANDBOX_ROOTFS"
          sudo rm -rf \
            "$SANDBOX_ROOTFS" \
            /tmp/everydayai-sandbox-test-venv \
            /tmp/nsjail \
            /tmp/everydayai-sandbox-worker \
            "$SANDBOX_ROOTFS_MANIFEST"
          sudo rm -f "$SANDBOX_HOST_MARKER"
          sudo rmdir /sys/fs/cgroup/everydayai-sandbox-contract
          test ! -e "$SANDBOX_ROOTFS"
          exit "$residue"
